finding: >-
  Klue publishes no rate limits. This is an honest zero. Klue's only public API
  documentation is two marketing blog posts and its own MCP Agent Skill, and none
  of them states a request ceiling, a window, a burst allowance, a quota, or a
  429 contract. The Content API reference that would carry them lives inside the
  authenticated help centre (help.app.klue.com), where every path below the root
  returns 302 to /account/signin, so the numbers could not be read even if they
  are documented there.
response_headers:
  documented: false
  observed: false
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After headers are documented. They
    could not be observed either: every Klue API path requires a bearer token or
    an OAuth access token, and unauthenticated requests to app.klue.com return
    302 to /account/signin or a JSON 404 before any rate-limit header is emitted.
    An agent integrating Klue therefore has no runtime backoff signal it can rely
    on from documentation alone.
exhaustion_status_code: null
client_side_guidance:
  documented: true
  note: >-
    Klue's published Agent Skill imposes a CALL BUDGET rather than a rate limit —
    the quick-answer path is "a hard stop after two tool calls". This is an
    agent-behaviour rule Klue authored, not a server-enforced limit, and it is
    recorded here because it is the only throttling contract Klue publishes.
  source: https://raw.githubusercontent.com/kluein/klue-mcp-public/main/SKILL.md
