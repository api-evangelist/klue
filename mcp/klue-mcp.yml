parameters:
  date_filters:
    tools:
    - search
    - extract_battlecards
    params:
    - updatedAfter
    - updatedBefore
    format: ISO8601
    example: '2024-11-01T00:00:00Z'
tested_clients:
- OpenAI Agent Builder
- Microsoft Copilot Studio
- Claude Desktop
deployment:
  mode: remote
  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: searched
  checked: '2026-08-14'
  endpoint_note: >-
    Klue ships a real hosted MCP server but does NOT publish its URL. The mode is
    recorded as `remote` and the endpoint is left null rather than guessed. Two
    independent public facts establish `remote`: (1) Klue states the server has
    been tested with OpenAI Agent Builder, Microsoft Copilot Studio and Claude
    Desktop, and the first two are cloud connector platforms that can only consume
    a hosted HTTPS endpoint — there is no stdio path into them; (2) Klue ships no
    installable package anywhere (see packages/klue-packages.yml, package_count 0),
    so local-stdio is ruled out. Klue's blog refers to "one of Klue's MCP
    endpoints" and an "admin MCP endpoint", i.e. more than one hosted URL.
  auth_note: >-
    Recorded as oauth on probed evidence, not on a vendor claim.
    https://app.klue.com/.well-known/openid-configuration returns HTTP 200
    anonymously and publishes the scopes `stak_play_mcp:read` and
    `stak_play_mcp:edit` — the only scopes in the set whose names contain "mcp" —
    alongside `content:read`, `content:edit` and `win_loss:read`, which map onto
    this server's tool families. The same document advertises RFC 7591 dynamic
    client registration at /oauth/register (verified live: an anonymous POST with
    an invalid redirect_uri returns 400 invalid_redirect_uri), which is the
    registration mechanism remote MCP clients use. A bearer API key is
    additionally documented for the Content API. See scopes/klue-scopes.yml.
  probe:
    date: '2026-08-14'
    result: not-publicly-reachable
    dns:
    - {host: mcp.klue.com, resolves: false}
    paths_probed:
    - {url: 'https://app.klue.com/mcp', method: POST, jsonrpc: tools/list, status: 404}
    - {url: 'https://app.klue.com/api/mcp', method: POST, jsonrpc: tools/list, status: 404}
    - {url: 'https://app.klue.com/mcp/admin', method: POST, jsonrpc: tools/list, status: 404}
    - {url: 'https://app.klue.com/v1/mcp', method: POST, jsonrpc: tools/list, status: 404}
    - {url: 'https://mcp.klue.com/mcp', method: GET, status: 000, note: host does not resolve}
    note: >-
      tools/list could not be run against a live endpoint, so the tools[] list
      below remains searched from Klue's own published Agent Skill rather than
      introspected. Input schemas would require an authenticated tools/list.
  supersedes:
    checked: '2026-08-12'
    mode: none
    endpoint: https://app.klue.com
    source: catalog MCP census
    correction: >-
      The census recorded mode `none` with an endpoint set, which is
      self-contradictory: `none` means nobody ships a server, and Klue plainly
      does. The census had probed https://app.klue.com as if it were the MCP
      endpoint; it is the application root, not an MCP URL. Corrected to
      `remote` with a null endpoint.
oauth:
  discovery: https://app.klue.com/.well-known/openid-configuration
  scopes: scopes/klue-scopes.yml
  mcp_scopes: [stak_play_mcp:read, stak_play_mcp:edit]
