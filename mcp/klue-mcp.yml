- name: extract_cards
  description: Keyword search across cards (title, body, tags, competitor).
  surface: v1
  kind: discovery
- name: extract_battlecards
  description: Keyword search across battlecards.
  surface: v1
  kind: discovery
- name: create_card
  description: Create a card.
