security_incident:
  method: searched
  disclosed: '2026-06-18'
  url: https://klue.com/blog/an-update-on-recent-klue-security-incident
  http_status: 200
  title: An Update on the Recent Klue Security Incident
  detected: '2026-06-12'
  summary: >-
    Klue disclosed that an attacker gained access through a compromised legacy
    credential associated with an integration service and obtained OAuth tokens
    used to connect Klue with third-party platforms, including Salesforce. Klue
    states data within a number of connected customer environments was accessed,
    and that it found no evidence customer content stored within the Klue platform
    itself was impacted.
  response:
  - revoked affected credentials and tokens
  - removed unauthorized code
  - disabled potentially impacted integrations
  - notified law enforcement
  - engaged CrowdStrike for forensic validation
  - direct communication with affected customers
  commitments: >-
    Klue committed to a review of its security controls, credential management
    practices, monitoring capabilities and deployment processes.
  contact: security@klue.com
  correlates_with:
    status_page_incident: Data Sync Integration Issues
    date: '2026-06-14'
    note: >-
      The status-page incident and the disclosure post describe the same event
      window; recorded as corroboration between two Klue-published surfaces.
  api_relevance: >-
    Recorded in lifecycle/ because it is an OAuth-token and integration-layer
    event, not a marketing item: it is the operational history of the same
    authorization server documented in scopes/klue-scopes.yml and
    authentication/klue-authentication.yml. Klue published the disclosure on its
    own domain — the transparency itself is the operational signal.
