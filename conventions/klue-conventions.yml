generated: '2026-08-14'
method: searched
source: https://github.com/kluein/klue-mcp-public
docs: https://klue.com/blog/how-to-connect-klue-to-chatgpt
scope: >-
  Cross-cutting semantics for the Klue Content API and the Klue MCP server.
  Klue publishes no public OpenAPI document, so nothing here is derived from a
  spec; every entry is taken from Klue's public documentation, blog posts, its
  own published MCP Agent Skill, or — new in this round — the anonymous OAuth /
  OpenID Connect discovery document Klue serves from its application host.
authentication:
  style: [bearer-api-key, oauth2-authorization-code]
  header: Authorization
  oauth2:
    discovery: https://app.klue.com/.well-known/openid-configuration
    grant: authorization_code
    refresh: true
    pkce: S256
    dynamic_client_registration: https://app.klue.com/oauth/register
    scopes: scopes/klue-scopes.yml
    note: >-
      Klue documents the bearer API key in prose and documents the OAuth surface
      nowhere — the discovery document is the only public description of it.
  detail: authentication/klue-authentication.yml
idempotency:
  supported: unknown
  note: >-
    Klue does not publicly document an idempotency key, retry contract, or
    request-deduplication window. The MCP surface exposes mutating tools
    (create_card, update_card, delete_cards, create_battlecard,
    update_battlecard, delete_battlecards) but no idempotency semantics are
    published for them. NOT claimed as supported and no Idempotency pointer is
    emitted.
pagination:
  style: unknown
  note: Not publicly documented.
filtering:
  supported: true
  content_api:
    dimensions: [competitors, battlecards, tags, date ranges]
    source: https://help.app.klue.com/
  mcp:
    date_params: [updatedAfter, updatedBefore]
    format: ISO8601
    example: '2024-11-01T00:00:00Z'
    applies_to: [search, extract_battlecards]
    recommended_default: 6 months
    source: https://raw.githubusercontent.com/kluein/klue-mcp-public/main/resources/v1-quick.md
versioning:
  scheme: connector-generation
  detail: >-
    Klue's MCP surface is versioned as two distinct connectors, v1 and v2, which
    Klue explicitly describes as "different connectors, not different versions of
    the same tool surface". Agents are told to detect the surface by tool-name
    signals rather than assume a version.
  current: v2
  detail_file: lifecycle/klue-lifecycle.yml
error_envelope:
  documented: false
  note: No public error reference or problem-details envelope is published.
rate_limits:
  documented: false
  note: >-
    No public rate-limit documentation and no rate-limit response headers. Not
    observable either — every path requires auth before headers are emitted.
  detail: rate-limits/klue-rate-limits.yml
  agent_call_budget: >-
    The only throttling contract Klue publishes is client-side: its Agent Skill
    hard-stops the quick-answer path after two tool calls.
tracing:
  request_id_header: unknown
citations:
  documented: true
  note: >-
    Klue's published skill requires agents to cite using the exact URL returned by
    a tool response and forbids shortening, constructing, or fabricating URLs.
    Citations must be numbered inline immediately after the claim, never grouped.
  source: https://raw.githubusercontent.com/kluein/klue-mcp-public/main/SKILL.md
agent_safety:
  documented: true
  rules:
  - Mutation tools are never called without an explicit user request.
  - Unknown tools are classified by role before use; ask before using when unsure.
  - Quick path is a hard stop after two tool calls.
  - Never answer from memory; always ground in retrieved sources.
  source: https://raw.githubusercontent.com/kluein/klue-mcp-public/main/SKILL.md
related:
  authentication: authentication/klue-authentication.yml
  scopes: scopes/klue-scopes.yml
  lifecycle: lifecycle/klue-lifecycle.yml
  mcp: mcp/klue-mcp.yml
  skills: skills/_index.yml
  rate_limits: rate-limits/klue-rate-limits.yml
  plans: plans/klue-plans-pricing.yml
  packages: packages/klue-packages.yml
  well_known: well-known/klue-well-known.yml
