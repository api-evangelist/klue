finding: >-
  Klue ships no first-party client library on any public package registry. This
  is an honest zero, not an unchecked field: every registry below was queried
  directly and every candidate name resolved to either a 404 or a third-party
  package with no relationship to Klue. Consumers of the Klue Content API are
  expected to call it directly with a bearer API key, and consumers of the Klue
  MCP server connect over the wire rather than by installing a package — there is
  no npx/pip install path for the MCP server either.
