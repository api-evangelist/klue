apis:
- aid: klue:content-api
  name: Klue Content API
  description: >-
    The Klue Content API returns an organization's published Klue cards and
    battlecards to external tools and agents, filterable by competitor,
    battlecard, tag and date range. Access is authenticated with a named,
    expiring API key passed as a bearer token, created by an Admin under Apps
    and Integrations. Klue distributes the API's OpenAPI schema inside the
    authenticated application so customers can paste it directly into tools such
    as a custom ChatGPT GPT action.
  humanURL: https://klue.com/blog/how-to-connect-klue-to-chatgpt
  baseURL: https://app.klue.com
  tags:
  - Competitive Intelligence
  - Content
  - Battlecards
  properties:
  - type: Authentication
    url: authentication/klue-authentication.yml
  - type: Conventions
    url: conventions/klue-conventions.yml
- aid: klue:mcp
  name: Klue MCP Server
  description: >-
    Klue's Model Context Protocol server lets internal AI agents and enterprise
    copilots retrieve permissioned competitive intelligence from Klue. It ships
    two distinct connector surfaces: v1 exposes cards, battlecards, search and
    fetch plus create, update and delete tooling, and v2 exposes curated Smart
    Answers and AI-generated agent insights. Win-loss transcript and report tools
    can appear on either surface. Klue describes it as the only competitive
    intelligence MCP server supporting both read and writeback.
  humanURL: https://klue.com/blog/introducing-klue-mcp-server
  baseURL: https://app.klue.com
  tags:
  - MCP
  - Agents
  - Competitive Intelligence
  - Win-Loss
