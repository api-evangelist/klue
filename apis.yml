aid: klue
name: Klue
description: >-
  Klue is a Vancouver, BC based B2B SaaS company founded in 2015 that builds a
  competitive enablement platform combining competitive intelligence and
  win-loss analysis for revenue teams. The platform collects, curates and
  distributes competitor intel as cards and battlecards, and layers AI on top
  through its Compete Agent, Auto Insights, Deal Tips and Smart Answers
  products, alongside a win-loss suite spanning human expert interviews, an AI
  interviewer and blindspot interviews. Klue exposes its curated intelligence to
  developers and AI agents through a Content API secured with bearer API keys
  and a production Model Context Protocol server offering two connector
  surfaces plus read and writeback tooling, with an Agent Skill published
  openly on GitHub. It integrates with Salesforce, Gong, Slack, Microsoft Teams,
  HubSpot, Highspot, Seismic, Guru and others, and maintains SOC 2 Type II
  compliance.
